name: call-cicd-matrix
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
  security-events: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        provider:
          - projects/1094498259535/locations/global/workloadIdentityPools/gh-patrick-testing-non-main/providers/github-by-repos
          - projects/1094498259535/locations/global/workloadIdentityPools/gh-patrick-testing-pr/providers/github-by-repos
          - projects/1094498259535/locations/global/workloadIdentityPools/gh-patrick-testing-main/providers/github-by-repos
          - projects/1094498259535/locations/global/workloadIdentityPools/gh-patrick-testing/providers/github-by-repos-non-main
          - projects/1094498259535/locations/global/workloadIdentityPools/gh-patrick-testing/providers/github-by-repos-pr
          - projects/1094498259535/locations/global/workloadIdentityPools/patrick-testing/providers/github-by-repos
    uses: celo-org/reusable-workflows/.github/workflows/container-cicd.yaml@v1.14.2
    with:
      workload-id-provider: ${{ matrix.provider }}
      service-account: patrick-testing-ro@clabs-secrets-and-permissions.iam.gserviceaccount.com
      artifact-registry: us-west1-docker.pkg.dev/devopsre/dev-images/testing-action
      tags: probe-${{ github.run_id }}
      context: /home/runner
      file: work/tpl-probe/tpl-probe/Dockerfile
      trivy: false
